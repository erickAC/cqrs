spring.application.name=cqrs

app.datasource.command.url=jdbc:h2:mem:commanddb;DB_CLOSE_DELAY=-1
app.datasource.command.username=sa
app.datasource.command.password=
app.datasource.command.driver-class-name=org.h2.Driver

app.datasource.query.url=jdbc:h2:mem:querydb;DB_CLOSE_DELAY=-1
app.datasource.query.username=sa
app.datasource.query.password=
app.datasource.query.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
